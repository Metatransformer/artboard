<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="10" fill="#2563eb"/>
  <text x="140" y="140" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="5" text-anchor="start" fill="#2563eb" xml:space="preserve">
    <tspan x="140" y="157.38">BY THE NUMBERS</tspan>
  </text>
  <text x="140" y="196" font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" text-anchor="start" fill="#0f172a" xml:space="preserve">
    <tspan x="140" y="256.04">A quieter tool, measured</tspan>
  </text>
  <line x1="140" y1="420" x2="610" y2="420" stroke-linecap="round" stroke="#e2e8f0" stroke-width="2"/>
  <text x="140" y="460" font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="132" font-weight="700" letter-spacing="-4" text-anchor="start" fill="#0f172a" xml:space="preserve">
    <tspan x="140" y="564.28">3.2×</tspan>
  </text>
  <text x="140" y="650" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="start" fill="#2563eb" xml:space="preserve">
    <tspan x="140" y="667.38">FASTER TO FIRST DRAFT</tspan>
  </text>
  <text x="140" y="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64748b" xml:space="preserve">
    <tspan x="140" y="718.96">Measured from empty canvas to a</tspan>
    <tspan x="140" y="754.96">shareable export.</tspan>
  </text>
  <line x1="730" y1="420" x2="1200" y2="420" stroke-linecap="round" stroke="#e2e8f0" stroke-width="2"/>
  <text x="730" y="460" font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="132" font-weight="700" letter-spacing="-4" text-anchor="start" fill="#0f172a" xml:space="preserve">
    <tspan x="730" y="564.28">97%</tspan>
  </text>
  <text x="730" y="650" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="start" fill="#2563eb" xml:space="preserve">
    <tspan x="730" y="667.38">FILES OPEN CLEAN</tspan>
  </text>
  <text x="730" y="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64748b" xml:space="preserve">
    <tspan x="730" y="718.96">Documents from older builds load</tspan>
    <tspan x="730" y="754.96">with no repair step.</tspan>
  </text>
  <line x1="1320" y1="420" x2="1790" y2="420" stroke-linecap="round" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1320" y="460" font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="132" font-weight="700" letter-spacing="-4" text-anchor="start" fill="#0f172a" xml:space="preserve">
    <tspan x="1320" y="564.28">40ms</tspan>
  </text>
  <text x="1320" y="650" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="start" fill="#2563eb" xml:space="preserve">
    <tspan x="1320" y="667.38">COLD START</tspan>
  </text>
  <text x="1320" y="700" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64748b" xml:space="preserve">
    <tspan x="1320" y="718.96">Time to an interactive canvas on a</tspan>
    <tspan x="1320" y="754.96">mid-range laptop.</tspan>
  </text>
  <line x1="140" y1="940" x2="1780" y2="940" stroke-linecap="round" stroke="#e2e8f0" stroke-width="2"/>
  <text x="140" y="976" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#94a3b8" xml:space="preserve">
    <tspan x="140" y="993.38">Internal benchmark · n = 1,240 documents</tspan>
  </text>
  <text x="1580" y="976" font-family="'JetBrains Mono', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="400" text-anchor="end" fill="#94a3b8" xml:space="preserve">
    <tspan x="1780" y="993.38">03 / 24</tspan>
