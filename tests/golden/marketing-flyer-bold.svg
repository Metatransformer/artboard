  <text x="100" y="1250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="start" fill="#0f766e" xml:space="preserve"><tspan x="100" y="1267.38">COST</tspan></text>
