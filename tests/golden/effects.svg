<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img">
  <title>Effects</title>
  <defs>
    <filter id="fx-0" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="e1"/>
      <feOffset in="e1" dx="6" dy="8" result="e2"/>
      <feGaussianBlur in="e2" stdDeviation="5" result="e3"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="e4"/>
      <feComposite in="e4" in2="e3" operator="in" result="e5"/>
      <feMerge>
        <feMergeNode in="e5"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fx-1" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="e1"/>
      <feGaussianBlur in="e1" stdDeviation="8" result="e2"/>
      <feFlood flood-color="#38bdf8" flood-opacity="0.9" result="e3"/>
      <feComposite in="e3" in2="e2" operator="in" result="e4"/>
      <feMerge>
        <feMergeNode in="e4"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fx-2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="e1"/>
      <feFlood flood-color="#f43f5e" flood-opacity="1" result="e2"/>
      <feComposite in="e2" in2="e1" operator="in" result="e3"/>
      <feMerge>
        <feMergeNode in="e3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fx-3" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="24" dy="24" result="e1"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="e2"/>
      <feComposite in="e2" in2="e1" operator="in" result="e3"/>
      <feOffset in="SourceAlpha" dx="16" dy="16" result="e4"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="e5"/>
      <feComposite in="e5" in2="e4" operator="in" result="e6"/>
      <feOffset in="SourceAlpha" dx="8" dy="8" result="e7"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="e8"/>
      <feComposite in="e8" in2="e7" operator="in" result="e9"/>
      <feMerge>
        <feMergeNode in="e3"/>
        <feMergeNode in="e6"/>
        <feMergeNode in="e9"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fx-4" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <path id="curve-5" d="M 40 485.2 Q 180 418 320 485.2" fill="none"/>
    <filter id="fx-6" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="e1"/>
      <feComponentTransfer in="e1">
        <feFuncR type="table" tableValues="0.1922 0.9843"/>
        <feFuncG type="table" tableValues="0.1804 0.749"/>
        <feFuncB type="table" tableValues="0.5059 0.1412"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vig-7" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="fx-8" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceGraphic" result="e1">
        <feFuncR type="linear" slope="1.3" intercept="0.05"/>
        <feFuncG type="linear" slope="1.3" intercept="0.05"/>
        <feFuncB type="linear" slope="1.3" intercept="0.05"/>
      </feComponentTransfer>
      <feColorMatrix in="e1" type="saturate" values="0.6" result="e2"/>
      <feColorMatrix in="e2" type="hueRotate" values="45" result="e3"/>
      <feColorMatrix in="e3" type="matrix" values="0.84825 0.19225 0.04725 0 0 0.08725 0.9215 0.042 0 0 0.068 0.1335 0.78275 0 0 0 0 0 1 0" result="e4"/>
      <feComponentTransfer in="e4">
        <feFuncR type="table" tableValues="0.1 0.9"/>
        <feFuncG type="table" tableValues="0.1 0.9"/>
        <feFuncB type="table" tableValues="0.1 0.9"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="820" fill="#111827"/>
  <g>
    <g filter="url(#fx-0)">
      <text x="40" y="60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="180" y="91.6">shadow</tspan>
      </text>
    </g>
  </g>
  <g>
    <g filter="url(#fx-1)">
      <text x="360" y="60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="500" y="91.6">glow</tspan>
      </text>
    </g>
  </g>
  <g>
    <g filter="url(#fx-2)">
      <text x="680" y="60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="820" y="91.6">outline</tspan>
      </text>
    </g>
  </g>
  <g>
    <g filter="url(#fx-3)">
      <text x="40" y="240" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="180" y="271.6">echo</tspan>
      </text>
    </g>
  </g>
  <g>
    <g filter="url(#fx-4)">
      <text x="360" y="240" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="500" y="271.6">blur</tspan>
      </text>
    </g>
  </g>
  <g>
    <g>
      <rect x="666" y="226" width="308" height="118" rx="10" fill="#f59e0b"/>
      <text x="680" y="240" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="820" y="271.6">plate</tspan>
      </text>
    </g>
  </g>
  <text font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">
    <textPath href="#curve-5" startOffset="50%">curve</textPath>
  </text>
  <g>
    <g filter="url(#fx-6)">
      <text x="360" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="500" y="451.6">duotone</tspan>
      </text>
    </g>
  </g>
  <g>
    <g>
      <text x="680" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="820" y="451.6">vignette</tspan>
      </text>
      <rect x="680" y="420" width="280" height="90" fill="url(#vig-7)" pointer-events="none"/>
    </g>
  </g>
  <g>
    <g filter="url(#fx-8)">
      <text x="40" y="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff" xml:space="preserve">
        <tspan x="180" y="631.6">adjust</tspan>
      </text>
    </g>
  </g>
  <g style="mix-blend-mode:multiply">
    <rect x="40" y="700" width="280" height="90" fill="#22d3ee" aria-hidden="true"/>
  </g>
</svg>
