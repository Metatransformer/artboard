  <g>
    <text x="60" y="730" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="600" letter-spacing="2" text-anchor="start" fill="url(#grad-0)" xml:space="preserve"><tspan x="60" y="761.6">Gradient underline</tspan></text>
    <path d="M60 766h393.1v2.4h-393.1Z" fill="url(#grad-1)"/>
