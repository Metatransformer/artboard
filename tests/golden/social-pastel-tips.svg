<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect x="0" y="0" width="1080" height="1080" fill="#eef2ea"/>
  <g opacity="0.35">
    <ellipse cx="990" cy="90" rx="230" ry="230" fill="#d8a7a0"/>
  </g>
  <text x="88" y="110" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="5" text-anchor="start" fill="#7d8b7f" xml:space="preserve">
    <tspan x="88" y="127.38">THREE SMALL HABITS</tspan>
  </text>
  <text x="88" y="160" font-family="'Playfair Display', ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="400" text-anchor="start" fill="#2f3e35" xml:space="preserve">
    <tspan x="88" y="220.04">Design calmer</tspan>
    <tspan x="88" y="305.16">interfaces</tspan>
  </text>
  <rect x="88" y="380" width="904" height="150" rx="24" ry="24" fill="#ffffff"/>
  <ellipse cx="162" cy="454" rx="34" ry="34" fill="#d8a7a0"/>
  <text x="128" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff" xml:space="preserve">
    <tspan x="162" y="459.7">1</tspan>
  </text>
  <text x="224" y="418" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="start" fill="#2f3e35" xml:space="preserve">
    <tspan x="224" y="444.86">Give it room</tspan>
  </text>
  <text x="224" y="466" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64766a" xml:space="preserve">
    <tspan x="224" y="484.96">Whitespace is a decision, not leftover space.</tspan>
  </text>
  <rect x="88" y="556" width="904" height="150" rx="24" ry="24" fill="#ffffff"/>
  <ellipse cx="162" cy="630" rx="34" ry="34" fill="#d8a7a0"/>
  <text x="128" y="596" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff" xml:space="preserve">
    <tspan x="162" y="635.7">2</tspan>
  </text>
  <text x="224" y="594" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="start" fill="#2f3e35" xml:space="preserve">
    <tspan x="224" y="620.86">Two sizes, not five</tspan>
  </text>
  <text x="224" y="642" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64766a" xml:space="preserve">
    <tspan x="224" y="660.96">Pick a type ratio and hold it everywhere.</tspan>
  </text>
  <rect x="88" y="732" width="904" height="150" rx="24" ry="24" fill="#ffffff"/>
  <ellipse cx="162" cy="806" rx="34" ry="34" fill="#d8a7a0"/>
  <text x="128" y="772" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff" xml:space="preserve">
    <tspan x="162" y="811.7">3</tspan>
  </text>
  <text x="224" y="770" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="start" fill="#2f3e35" xml:space="preserve">
    <tspan x="224" y="796.86">Colour comes last</tspan>
  </text>
  <text x="224" y="818" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#64766a" xml:space="preserve">
    <tspan x="224" y="836.96">If it works in grey, it will work in colour.</tspan>
  </text>
  <line x1="88" y1="944" x2="992" y2="944" stroke-linecap="round" stroke="#cfd8cd" stroke-width="2"/>
  <text x="88" y="972" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" letter-spacing="2" text-anchor="start" fill="#7d8b7f" xml:space="preserve">
    <tspan x="88" y="990.96">@artboard</tspan>
  </text>
</svg>
