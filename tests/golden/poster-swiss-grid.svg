  <text x="200" y="1400" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="340" font-weight="800" letter-spacing="-10" text-anchor="start" fill="#09090b" xml:space="preserve"><tspan x="200" y="1668.6">FORM</tspan><tspan x="200" y="2015.4">FOLLOWS</tspan><tspan x="200" y="2362.2">FUNCTION</tspan></text>
  <line x1="200" y1="2600" x2="2280" y2="2600" stroke-linecap="round" stroke="#09090b" stroke-width="4" aria-hidden="true"/>
  <text x="200" y="2680" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="400" text-anchor="start" fill="#3f3f46" xml:space="preserve"><tspan x="200" y="2716.34">A retrospective of Swiss typographic</tspan><tspan x="200" y="2785.34">method, 1957 to 1972. Posters, grids, and the</tspan><tspan x="200" y="2854.34">discipline of the modular scale.</tspan></text>
  <text x="1320" y="2680" font-family="'JetBrains Mono', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="400" text-anchor="start" fill="#09090b" xml:space="preserve"><tspan x="1320" y="2714.76">12 March – 30 June</tspan><tspan x="1320" y="2789.56">Kunsthalle, Basel</tspan><tspan x="1320" y="2864.36">Daily 10:00 – 18:00</tspan></text>
